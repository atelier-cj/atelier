[package]
name = "cli"
version = "0.1.0"
cjc-version = "1.1.3"
output-type = "static"
compile-option = "-Woff unused"
link-option = "-lstdx.crypto.digest"
license = ["MIT"]
authors = ["ystyle"]
repository = "https://atomgit.com/ystyle/atelier"

[dependencies]
atelier = "0.1.4"
server = "0.1.0"
"opencj::ulid" = "0.1.2"
# 工具参数的 JSON 呈现与测试里的 JsonValue 构造需要直接引用该包
"jsonvalue" = "1.1.1"
# 与核心库保持同一来源：核心库同样依赖 xisp 0.4.1（已发中心仓）
"ystyle::xisp" = "0.4.1"
# A2A v1 协议层（a2a-cj 尚未发版，开发期用 path 依赖；发版前换回版本号）
# 路径相对本 cjpm.toml 所在目录（worktree 的 cli/ 成员目录）：四级上溯 = /home/ystyle/Projects/Cangjie
"a2a" = { path = "../../../../a2a-cj" }
"cjterm_stream" = "0.1.0"
"pulldown4cj" = "0.1.0"

[package.package-configuration."cli.app"]
output-type = "executable"
compile-option = "--static -Woff unused"
