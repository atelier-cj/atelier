[package]
name = "cli"
version = "0.1.0"
cjc-version = "1.1.3"
output-type = "static"
compile-option = "-Woff unused"
link-option = "-lstdx.crypto.digest"
license = ["MIT"]
authors = ["ystyle"]
repository = "https://atomgit.com/ystyle/atelier"

[dependencies]
atelier = { path = ".." }
server = { path = "../server" }
"opencj::ulid" = "0.1.2"
# 工具参数的 JSON 呈现与测试里的 JsonValue 构造需要直接引用该包
"jsonvalue" = "1.1.0"
# 与核心库保持同一来源：核心库以 path 依赖 xisp（其 PTC 增强尚未发版），
# 此处若仍钉中心仓版本会让同一个包出现两个来源。
"ystyle::xisp" = { path = "../../xisp" }
"cjterm_stream" = "0.1.0"
"pulldown4cj" = "0.1.0"

[package.package-configuration."cli.app"]
output-type = "executable"
compile-option = "--static -Woff unused"

[target.x86_64-unknown-linux-gnu]
link-option = "-luring"

[target.x86_64-w64-mingw32]
link-option = "-lcrypt32"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-unknown-linux-gnu.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-apple-darwin.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-apple-darwin.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-w64-mingw32.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
