[package]
name = "atelier"
version = "0.1.0"
cjc-version = "1.1.0"
output-type = "static"
compile-option = "-Woff unused"
link-option = "-lstdx.crypto.digest"

[dependencies]
"mcp" = "2.2.0"
"sonyflake" = "1.0.9"
"jsonvalue" = "1.0.1"
"gjson" = "1.1.1"
"ystyle::jsonrpc" = "0.4.1"
"bstorm" = "1.4.0"
"tomlcj" = "1.0.0"

[target.x86_64-unknown-linux-gnu]
link-option = "-luring"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = [ "${CANGJIE_STDX_PATH}" ]
