name: Release CLI

# 推 tag 即发版：工作流自己建 Release（挂三平台二进制），不需要先手动建 Release。
# 重跑某个已发布 tag 的构建用 workflow_dispatch。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（重跑构建用，如 v0.1.15）'
        required: true
        type: string

permissions:
  contents: write

env:
  CJC_VERSION: '1.1.3'
  BIN_NAME: atelier

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --title "$TAG" --generate-notes --verify-tag

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: ${{ env.CJC_VERSION }}
          components: stdx

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y liburing-dev zip

      - name: Build Linux binary
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cjpm build
          cp ./target/release/bin/cli.app "./target/release/bin/${BIN_NAME}"
          mkdir -p dist
          zip -j "dist/${BIN_NAME}_${TAG}_linux_amd64.zip" "./target/release/bin/${BIN_NAME}"
          # 固定名副本：releases/latest/download/<资产名> 只认资产名，带版本号的会随版本失效
          cp "dist/${BIN_NAME}_${TAG}_linux_amd64.zip" "dist/${BIN_NAME}_linux_amd64.zip"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber

  build-macos:
    needs: prepare
    runs-on: macos-15
    # 1.1.3 的 cjpm 在 darwin_aarch64 上创建 TLS 上下文会 SIGABRT（stdx.net.tls），
    # 换 1.2.0 工具链规避；若仍失败再考虑 macos-13（x86_64）
    env:
      CJC_VERSION: '1.2.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: ${{ env.CJC_VERSION }}
          components: stdx

      - name: Build macOS binary
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cjpm build
          cp ./target/release/bin/cli.app "./target/release/bin/${BIN_NAME}"
          mkdir -p dist
          zip -j "dist/${BIN_NAME}_${TAG}_macos_aarch64.zip" "./target/release/bin/${BIN_NAME}"
          cp "dist/${BIN_NAME}_${TAG}_macos_aarch64.zip" "dist/${BIN_NAME}_macos_aarch64.zip"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber

  build-windows:
    needs: prepare
    runs-on: ubuntu-latest
    # 暂不阻塞：bstorm 的宏包在 mingw 交叉编译时按宿主 Linux 参数链接（-luring），
    # 依赖链目前不支持 Windows 交叉构建。失败只显示黄标，不影响 Release。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: ${{ env.CJC_VERSION }}
          components: stdx

      - name: Install mingw toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Fetch Windows stdx
        run: |
          curl -sL "https://atomgit.com/Cangjie/cangjie_stdx/releases/download/v1.1.0.1/cangjie-stdx-windows-x64-1.1.0.1.zip" -o /tmp/stdx-win.zip
          mkdir -p /tmp/stdx-win
          unzip -o /tmp/stdx-win.zip -d /tmp/stdx-win
          find /tmp/stdx-win -name "libstdx.a" | head -3

      - name: Build Windows binary
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PATH_WIN=$(find /tmp/stdx-win -name "libstdx.a" | head -1 | xargs dirname)
          export CANGJIE_STDX_PATH="${PATH_WIN}"
          cjpm build --target x86_64-w64-mingw32
          cp ./target/x86_64-w64-mingw32/release/bin/cli.app.exe "./target/x86_64-w64-mingw32/release/bin/${BIN_NAME}.exe"
          mkdir -p dist
          zip -j "dist/${BIN_NAME}_${TAG}_windows_amd64.zip" "./target/x86_64-w64-mingw32/release/bin/${BIN_NAME}.exe"
          cp "dist/${BIN_NAME}_${TAG}_windows_amd64.zip" "dist/${BIN_NAME}_windows_amd64.zip"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
