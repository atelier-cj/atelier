name: Release CLI

# 推 tag 即发版：工作流自己建 Release（挂三平台二进制），不需要先手动建 Release。
# 重跑某个已发布 tag 的构建用 workflow_dispatch。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（重跑某个 tag 的构建）'
        required: false
        type: string
      ref:
        description: '要构建的代码 ref（验证改动时填 master，默认 master）'
        required: false
        default: master
        type: string

permissions:
  contents: write

env:
  CJC_VERSION: '1.2.0'
  BIN_NAME: atelier

jobs:
  prepare:
    # 只给 ref 的 dispatch 是纯验证构建：不建 Release、不上传资产
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --title "$TAG" --generate-notes --verify-tag

  build-linux:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}
      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: ${{ env.CJC_VERSION }}
          components: stdx

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y liburing-dev zip

      - name: Build Linux binary
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cjpm build
          cp ./target/release/bin/cli.app "./target/release/bin/${BIN_NAME}"
          mkdir -p dist
          zip -j "dist/${BIN_NAME}_${TAG}_linux_amd64.zip" "./target/release/bin/${BIN_NAME}"
          # 固定名副本：releases/latest/download/<资产名> 只认资产名，带版本号的会随版本失效
          cp "dist/${BIN_NAME}_${TAG}_linux_amd64.zip" "dist/${BIN_NAME}_linux_amd64.zip"

      - name: Upload release assets
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber

  build-macos:
    needs: prepare
    if: always() && (github.event_name == 'push' || inputs.tag != '') && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}
      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: ${{ env.CJC_VERSION }}
          components: stdx

      - name: Install OpenSSL
        # cjpm 访问 https 中心仓时要 dlopen libcrypto，找不到就直接 SIGABRT。
        # 要求：目录下有 libcrypto.dylib 和 libcrypto.3.dylib，且 DYLD_LIBRARY_PATH
        # 与 LIBRARY_PATH 都指向它（只设 LIBRARY_PATH 只管链接期，管不到运行期 dlopen）。
        run: |
          brew install openssl@3 || brew reinstall openssl@3
          OSSL="$(brew --prefix openssl@3)"
          echo "OpenSSL: $OSSL"
          ls -1 "$OSSL/lib" | grep -E '^libcrypto' || true
          test -f "$OSSL/lib/libcrypto.dylib"
          test -f "$OSSL/lib/libcrypto.3.dylib"
          echo "DYLD_LIBRARY_PATH=$OSSL/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$OSSL/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OSSL/lib/pkgconfig" >> $GITHUB_ENV

      - name: Build macOS binary
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cjpm build --target aarch64-apple-darwin
          BIN_PATH=$(find ./target -type f -name 'cli.app' | head -1)
          if [ -z "$BIN_PATH" ]; then echo "未找到 cli.app"; find ./target -maxdepth 4 -type d | head; exit 1; fi
          echo "找到: $BIN_PATH"
          mkdir -p dist
          cp "$BIN_PATH" "dist/${BIN_NAME}"
          chmod +x "dist/${BIN_NAME}"
          ls -la "dist/${BIN_NAME}"
          ( cd dist && zip "${BIN_NAME}_${TAG}_macos_aarch64.zip" "${BIN_NAME}" )
          cp "dist/${BIN_NAME}_${TAG}_macos_aarch64.zip" "dist/${BIN_NAME}_macos_aarch64.zip"

      - name: Upload release assets
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber

  build-windows:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    # Server 2025（Win11 内核）的升级补丁会导致编译失败；Server 2022 是 Win10 内核
    runs-on: windows-2022
    # 暂不阻塞：uhp 未声明 stdx 依赖，Windows 原生构建报 import 缺依赖；
    # 修上游前失败只显示黄标，不影响 Linux 资产发布。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}
      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: ${{ env.CJC_VERSION }}
          components: stdx

      - name: Show dependency resolution
        shell: bash
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: |
          echo "=== atelier/cjpm.toml 依赖声明 ==="
          grep -E '"(uhp|bstorm)"' atelier/cjpm.toml || true
          echo "=== cjpm update ==="
          cjpm update 2>&1 | tail -6 || true
          echo "=== lock 解析结果 ==="
          grep -E "uhp|bstorm" cjpm.lock 2>/dev/null || echo "无 lock"
          echo "=== CANGJIE_STDX_PATH ==="
          echo "$CANGJIE_STDX_PATH"
          ls -d "$CANGJIE_STDX_PATH" 2>/dev/null || echo "路径不存在"

      - name: Build Windows binary
        shell: bash
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # 显式指定 target：Windows runner 上的默认 target 字符串未必是 mingw，
          # 不匹配时 [target.x86_64-w64-mingw32.*] 的 stdx 声明不会被采用
          cjpm build --target x86_64-w64-mingw32
          echo "=== 产物位置 ==="
          BIN_PATH=$(find ./target -type f \( -name 'cli.app.exe' -o -name 'cli.app' \) | head -1)
          if [ -z "$BIN_PATH" ]; then
            echo "未找到 cli.app 产物，target 内容："
            find ./target -maxdepth 4 -type d | head -20
            exit 1
          fi
          echo "找到: $BIN_PATH"
          cp "$BIN_PATH" "./${BIN_NAME}.exe"
          mkdir -p dist
          7z a "dist/${BIN_NAME}_${TAG}_windows_amd64.zip" "./${BIN_NAME}.exe"
          cp "dist/${BIN_NAME}_${TAG}_windows_amd64.zip" "dist/${BIN_NAME}_windows_amd64.zip"

      - name: Upload release assets
        if: github.event_name == 'push' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
