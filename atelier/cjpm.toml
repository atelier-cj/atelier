[package]
name = "atelier"
version = "0.1.0"
cjc-version = "1.1.0"
output-type = "static"
compile-option = "-Woff unused"
link-option = "-lstdx.crypto.digest"
license = ["MIT"]
authors = ["ystyle"]
repository = "https://atomgit.com/ystyle/atelier"

[dependencies]
"mcp" = "2.3.14"
"sonyflake" = "1.0.9"
"jsonvalue" = "1.1.0"
"mustache" = "1.2.1"
"ystyle::jsonrpc" = "0.7.7"
"bstorm" = "1.4.7"
"opencj::ulid" = "0.1.2"
"llm_api" = "1.3.1"
"acp" = "0.2.5"
# PTC 程序执行引擎（中断检查点 / 纯函数子集 / 严格解析由 xisp 0.4.1 提供）
"ystyle::xisp" = "0.4.1"

[profile.test]
filter = "-ProviderIntegrationTest.*"
