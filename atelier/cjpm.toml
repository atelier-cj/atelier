[package]
name = "atelier"
version = "0.1.16"
description = "纯仓颉实现的 Agent Harness：把模型变成 Agent 的那层脚手架（工具 / Provider / 会话 / 压缩 / 信任闸门 / ACP）"
cjc-version = "1.1.0"
output-type = "static"
compile-option = "-Woff unused"
link-option = "-lstdx.crypto.digest"
include = ["/src", "/LICENSE"]
license = ["MIT"]
authors = ["ystyle"]
repository = "https://atomgit.com/ystyle/atelier"

[dependencies]
"mcp" = "2.3.16"
"sonyflake" = "1.0.9"
"jsonvalue" = "1.1.1"
"mustache" = "1.2.1"
"ystyle::jsonrpc" = "0.7.9"
"bstorm" = "2.1.2"
"opencj::ulid" = "0.1.2"
"llm_api" = "1.4.2"
"acp" = "0.3.1"
# UHP（Unified Harness Protocol）：第四种执行位置（远端 harness 自带环境）
"uhp" = "0.1.3"
# PTC 程序执行引擎（中断检查点 / 纯函数子集 / 严格解析由 xisp 0.4.1 提供）
"ystyle::xisp" = "0.5.0"
# 编译期读取 cjpm.toml 的版本号（产品版本由 cjpm ws 物化到本成员）
"cjpminfo" = "1.2.1"
# TOML 配置装载（Agent/Provider 配置模型；下游宿主也用这套）
"tomlcj" = "1.0.1"
# A2A v1.0 协议层（a2a-cj，中心仓 0.1.0）
"a2a" = "0.1.1"

[profile.test]
filter = "-ProviderIntegrationTest.*"

# 成员独立构建/发版时生效（工作区内构建由根 cjpm.toml 统一提供，此处为独立场景保留）
[target.x86_64-unknown-linux-gnu]
link-option = "-luring"
[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]

[target.aarch64-unknown-linux-gnu.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]

[target.x86_64-apple-darwin.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-apple-darwin.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]

[target.x86_64-w64-mingw32]
link-option = "-lcrypt32"
[target.x86_64-w64-mingw32.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
